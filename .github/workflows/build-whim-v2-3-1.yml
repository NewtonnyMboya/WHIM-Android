name: Build WHIM v2.3.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "WHIM_Android_Project_v2_3_1_Functionality_Repair.zip"
      - ".github/workflows/build-whim-v2-3-1.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract repaired source package
        run: |
          test -f WHIM_Android_Project_v2_3_1_Functionality_Repair.zip
          unzip -q WHIM_Android_Project_v2_3_1_Functionality_Repair.zip -d source
          PROJECT="$(find source -type f -path '*/android-apk-project/settings.gradle' -print -quit | sed 's#/settings.gradle##')"
          test -n "$PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Rename APK
        run: |
          mkdir -p release
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" release/whim-v2.3.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whim-v2.3.1-apk
          path: release/whim-v2.3.1.apk
          if-no-files-found: error
