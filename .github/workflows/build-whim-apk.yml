name: Build WHIM Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-whim-apk.yml'
      - 'WHIM_Android_Project_v2_1_Prepared.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use runner-provided Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory is not available on this runner"
            exit 1
          fi
          echo "Android SDK root: $SDK_ROOT"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type d | head -80
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Extract WHIM v2.1 project
        run: |
          unzip -q WHIM_Android_Project_v2_1_Prepared.zip -d whim-source
          PROJECT_DIR=""
          while IFS= read -r SETTINGS_FILE; do
            CANDIDATE_DIR="$(dirname "$SETTINGS_FILE")"
            if [ -f "$CANDIDATE_DIR/app/build.gradle" ] && [ -f "$CANDIDATE_DIR/app/src/main/AndroidManifest.xml" ]; then
              PROJECT_DIR="$CANDIDATE_DIR"
              break
            fi
          done < <(find whim-source -type f -name settings.gradle -print)
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No complete Android Gradle project was found."
            find whim-source -maxdepth 8 -type f | sort | head -250
            exit 1
          fi
          echo "Detected Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "APK_RELATIVE_PATH=$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"

      - name: Add Android print, upload and download support
        shell: bash
        run: |
          set -euo pipefail
          SRC="$PROJECT_DIR/app/src/main/java/com/infinitycyber/whim"
          mkdir -p "$SRC"
          cat > "$SRC/MainActivity.java" <<'JAVA'
          package com.infinitycyber.whim;

          import android.Manifest;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.ActivityNotFoundException;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.util.Arrays;

          public class MainActivity extends Activity {
              private static final int FILE_PICKER_REQUEST = 4201;
              private static final int CAMERA_PERMISSION_REQUEST = 4202;
              private WebView webView;
              private ValueCallback<Uri[]> fileChooserCallback;
              private PermissionRequest pendingWebPermission;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  webView.addJavascriptInterface(new PrintBridge(), "AndroidPrint");
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("file:///android_asset/") || url.startsWith("https://") || url.startsWith("http://") || url.startsWith("content:")) {
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.evaluateJavascript(
                              "(function(){try{window.print=function(){if(window.AndroidPrint){AndroidPrint.print()}else{}};}catch(e){}})();",
                              null
                          );
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileChooserCallback != null) fileChooserCallback.onReceiveValue(null);
                          fileChooserCallback = callback;
                          Intent intent;
                          try {
                              intent = params.createIntent();
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              startActivityForResult(intent, FILE_PICKER_REQUEST);
                              return true;
                          } catch (ActivityNotFoundException ex) {
                              fileChooserCallback = null;
                              Toast.makeText(MainActivity.this, "No file picker is available on this device.", Toast.LENGTH_LONG).show();
                              return false;
                          }
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          boolean requestsCamera = Arrays.asList(request.getResources()).contains(PermissionRequest.RESOURCE_VIDEO_CAPTURE);
                          if (!requestsCamera) {
                              request.deny();
                              return;
                          }
                          if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                              request.grant(request.getResources());
                          } else {
                              pendingWebPermission = request;
                              requestPermissions(new String[]{Manifest.permission.CAMERA}, CAMERA_PERMISSION_REQUEST);
                          }
                      }
                  });
                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                      try {
                          if (!(url.startsWith("https://") || url.startsWith("http://"))) {
                              Toast.makeText(this, "This download link is not supported.", Toast.LENGTH_LONG).show();
                              return;
                          }
                          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                          request.setTitle(URLUtil.guessFileName(url, contentDisposition, mimeType));
                          request.setDescription("Downloading from WHIM");
                          request.setMimeType(mimeType);
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,
                              URLUtil.guessFileName(url, contentDisposition, mimeType));
                          String cookies = CookieManager.getInstance().getCookie(url);
                          if (cookies != null) request.addRequestHeader("Cookie", cookies);
                          if (userAgent != null) request.addRequestHeader("User-Agent", userAgent);
                          DownloadManager manager = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                          manager.enqueue(request);
                          Toast.makeText(this, "Download started. Check Downloads or notifications.", Toast.LENGTH_LONG).show();
                      } catch (Exception e) {
                          Toast.makeText(this, "Could not start download: " + e.getMessage(), Toast.LENGTH_LONG).show();
                      }
                  });
                  if (savedInstanceState == null) {
                      webView.loadUrl("file:///android_asset/index.html");
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              private final class PrintBridge {
                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(() -> {
                          try {
                              PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                              if (printManager == null) {
                                  Toast.makeText(MainActivity.this, "Android printing service is unavailable.", Toast.LENGTH_LONG).show();
                                  return;
                              }
                              printManager.print("WHIM document", webView.createPrintDocumentAdapter("WHIM document"),
                                  new PrintAttributes.Builder().build());
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Unable to open print dialog: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_PICKER_REQUEST && fileChooserCallback != null) {
                      Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      fileChooserCallback.onReceiveValue(results);
                      fileChooserCallback = null;
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == CAMERA_PERMISSION_REQUEST && pendingWebPermission != null) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          pendingWebPermission.grant(pendingWebPermission.getResources());
                      } else {
                          pendingWebPermission.deny();
                          Toast.makeText(this, "Camera permission was denied.", Toast.LENGTH_LONG).show();
                      }
                      pendingWebPermission = null;
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) webView.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (fileChooserCallback != null) {
                      fileChooserCallback.onReceiveValue(null);
                      fileChooserCallback = null;
                  }
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          JAVA
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["PROJECT_DIR"])
          manifest = root / "app/src/main/AndroidManifest.xml"
          text = manifest.read_text()
          if "android.permission.INTERNET" not in text:
              text = text.replace("<application", '    <uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          if "android.permission.CAMERA" not in text:
              text = text.replace("<application", '    <uses-permission android:name="android.permission.CAMERA" />\n    <application', 1)
          manifest.write_text(text)
          gradle = root / "app/build.gradle"
          g = gradle.read_text()
          import re
          g = re.sub(r'versionCode\s+\d+', 'versionCode 22', g, count=1)
          g = re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "2.2"', g, count=1)
          gradle.write_text(g)
          print("Enabled Android system print, file upload picker, Downloads integration and camera permission.")
          PY

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WHIM-Android-v2.2-APK
          path: ${{ env.APK_RELATIVE_PATH }}
          if-no-files-found: error
          retention-days: 14
